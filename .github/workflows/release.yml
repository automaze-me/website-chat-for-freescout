name: Release

# On a version tag (e.g. v1.0.1): run the tests, build the install zip and
# publish a GitHub Release with it. The zip holds a top-level
# website-chat-for-freescout/ folder, the layout WordPress expects under
# Plugins > Add New > Upload Plugin. Installed copies update from wordpress.org.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        # tests/plugin-meta.php checks that Version, LCFF_VERSION and the
        # readme's Stable tag agree; this ties the tag to them.
        run: |
          version=$(sed -n 's/^ \* Version: *//p' website-chat-for-freescout.php | tr -d '[:space:]')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi

      - name: Run the tests
        run: |
          for f in tests/*.php; do
            php "$f" > /dev/null || { php "$f" | grep -v '^ok'; exit 1; }
          done
          node tests/hours.test.js > /dev/null

      - name: Build plugin zip
        # git archive honors export-ignore in .gitattributes (tests, tools,
        # .github, .wordpress-org, README.md, ... stay out of the install zip).
        run: git archive --format=zip --prefix=website-chat-for-freescout/ -o website-chat-for-freescout.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" website-chat-for-freescout.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
