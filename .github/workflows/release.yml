name: Release

# On a version tag (e.g. v1.0.1): run the tests, build the plugin package,
# publish it on wordpress.org and then publish a GitHub Release with the same
# package as a zip.
#
# The package is `git archive` of the tag, so the export-ignore lines in
# .gitattributes decide what ships, on wordpress.org and in the GitHub zip
# alike. The zip holds a top-level website-chat-for-freescout/ folder, the
# layout WordPress expects under Plugins > Add New > Upload Plugin. Installed
# copies update from wordpress.org.
#
# Needs two repository secrets: SVN_USERNAME (the wordpress.org username,
# automazeme) and SVN_PASSWORD (set under Account & Security on the
# wordpress.org profile).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        # tests/plugin-meta.php checks that Version, LCFF_VERSION and the
        # readme's Stable tag agree; this ties the tag to them.
        run: |
          version=$(sed -n 's/^ \* Version: *//p' website-chat-for-freescout.php | tr -d '[:space:]')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi

      - name: Run the tests
        run: |
          for f in tests/*.php; do
            php "$f" > /dev/null || { php "$f" | grep -v '^ok'; exit 1; }
          done
          node tests/hours.test.js > /dev/null

      - name: Build plugin package
        # git archive honors export-ignore in .gitattributes (tests, tools,
        # languages, .github, .wordpress-org, README.md, ... stay out). The
        # same archive goes into the zip and, unpacked, to wordpress.org.
        run: |
          git archive --format=zip --prefix=website-chat-for-freescout/ -o website-chat-for-freescout.zip HEAD
          mkdir build
          git archive --format=tar --prefix=website-chat-for-freescout/ HEAD | tar -x -C build

      - name: Deploy to wordpress.org
        # One SVN commit: build/website-chat-for-freescout becomes trunk, trunk
        # is copied to tags/<version without the v>, and .wordpress-org/ is
        # synced to assets/. With BUILD_DIR set the action ignores .distignore.
        # A version that already exists in tags/ is skipped, so re-running the
        # workflow after a failed GitHub release step does not deploy twice.
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: website-chat-for-freescout
          BUILD_DIR: build/website-chat-for-freescout

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" website-chat-for-freescout.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
